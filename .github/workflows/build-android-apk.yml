name: Build Green Banana Offline Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Green_Banana_Myanmar_APK_Build_Ready_V1_3_PopSound.zip'
      - 'Green_Banana_Myanmar_APK_Build_Ready_V1_2.zip'
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'check_project.py'
permissions:
  contents: read
jobs:
  build:
    name: Compile, verify and publish installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout files
        uses: actions/checkout@v4
      - name: Extract uploaded Android source ZIP if present
        shell: bash
        run: |
          set -euo pipefail
          if [ -s Green_Banana_Myanmar_APK_Build_Ready_V1_3_PopSound.zip ] || [ -s Green_Banana_Myanmar_APK_Build_Ready_V1_2.zip ]; then
            echo 'Extracting latest Green Banana Android project ZIP...'
            python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          zip_path = Path("Green_Banana_Myanmar_APK_Build_Ready_V1_3_PopSound.zip")
          if not zip_path.exists():
              zip_path = Path("Green_Banana_Myanmar_APK_Build_Ready_V1_2.zip")
          with ZipFile(zip_path) as archive:
              for member in archive.infolist():
                  dest = Path(member.filename)
                  if dest.is_absolute() or ".." in dest.parts:
                      raise ValueError("Unsafe archive entry: " + member.filename)
              archive.extractall(".")
          print("Project ZIP extracted successfully.")
          PY
          fi
      - name: Check native Android source and offline assets
        shell: bash
        run: |
          set -euo pipefail
          test -s settings.gradle
          test -s build.gradle
          test -s app/build.gradle
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/java/asia/aaii/greenbanana/MainActivity.java
          test -s app/src/main/java/asia/aaii/greenbanana/Site3DView.java
          test -s app/src/main/java/asia/aaii/greenbanana/TouchFeedback.java
          test -s app/src/main/res/raw/ui_click.wav
          test -s app/src/main/assets/site_model.bin
          test -s app/src/main/assets/guides/Green_Banana_Myanmar_Innovation.pdf
          ! grep -qi 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          import struct, json
          root = Path("app/src/main/assets")
          assert (root / "site_model.bin").read_bytes()[:4] == b"GB3D"
          project = json.loads((root / "data/project.json").read_text())
          assert len(project["areas"]) == 10
          assert sum(x["acres"] for x in project["areas"]) == 100
          print("Offline native app source / model / ten zones verified.")
          PY
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Use preinstalled GitHub Ubuntu Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Compile Native APK with Touch Feedback
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --warning-mode all :app:assembleDebug 2>&1 | tee build-output.log
      - name: Verify APK signature and offline files
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          unzip -t "$APK" | tail -1
          unzip -Z1 "$APK" | grep -q '^assets/site_model.bin$'
          unzip -Z1 "$APK" | grep -q '^assets/guides/Green_Banana_Myanmar_Innovation.pdf$'
          cp "$APK" Green_Banana_Myanmar_Offline_Native_V1_3_PopSound-debug.apk
          sha256sum Green_Banana_Myanmar_Offline_Native_V1_3_PopSound-debug.apk > SHA256SUMS.txt
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Green_Banana_Myanmar_Offline_APK_V1_3_PopSound
          path: |
            Green_Banana_Myanmar_Offline_Native_V1_3_PopSound-debug.apk
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload build errors when failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GBM_Android_Build_Error_Log
          path: build-output.log
          if-no-files-found: ignore

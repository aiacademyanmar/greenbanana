name: Build Green Banana Native Preview APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'preview-apk/**'
      - '.github/workflows/build-preview-apk.yml'
permissions:
  contents: read
jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Use GitHub Ubuntu Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          find "$SDK" -maxdepth 2 -type d | head -35
      - name: Install platform 35
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Build offline preview APK
        working-directory: preview-apk
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK signature and stage
        run: |
          set -euo pipefail
          APK=preview-apk/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -t "$APK" | tail -1
          cp "$APK" Green_Banana_Offline_Native_Preview_V1_3-debug.apk
          sha256sum Green_Banana_Offline_Native_Preview_V1_3-debug.apk > SHA256SUMS.txt
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Green_Banana_Offline_Native_Preview_APK_V1_3
          path: |
            Green_Banana_Offline_Native_Preview_V1_3-debug.apk
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
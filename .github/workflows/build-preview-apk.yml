name: Build Green Banana Native Preview APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'preview-apk/**'
      - '.github/workflows/build-preview-apk.yml'
permissions:
  contents: read
jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install platform 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Build offline preview APK
        working-directory: preview-apk
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK signature and stage
        run: |
          set -euo pipefail
          APK=preview-apk/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -t "$APK" | tail -1
          cp "$APK" Green_Banana_Offline_Native_Preview_V1_3-debug.apk
          sha256sum Green_Banana_Offline_Native_Preview_V1_3-debug.apk > SHA256SUMS.txt
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Green_Banana_Offline_Native_Preview_APK_V1_3
          path: |
            Green_Banana_Offline_Native_Preview_V1_3-debug.apk
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30